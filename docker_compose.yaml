version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # المتغيرات الإلزامية لعمل KRaft داخل صور Confluent
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "echo 'Waiting for Kafka...' &&
      sleep 15 &&
      kafka-topics --create --if-not-exists --topic test-topic --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic output-topic --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1"
    restart: "no"

  producer-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: producer-api
    depends_on:
      - kafka
    ports:
      - "5000:5000"
    restart: on-failure

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consumer
    depends_on:
      - kafka
      - postgres
    command: python scripts/consumer.py
    volumes:
      - ./:/app
    restart: on-failure

  jobmanager:
    image: flink:1.18-java11
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink-job:/opt/flink/jobs

  taskmanager:
    image: flink:1.18-java11
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./flink-job:/opt/flink/jobs

  flink-job:
    build:
      context: ./flink-job
      dockerfile: Dockerfile
    container_name: flink-job
    depends_on:
      - kafka
      - kafka-init
      - jobmanager
      - taskmanager
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: kafka_events
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  db-seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db-seed
    depends_on:
      - postgres
    command: python scripts/seed.py
    volumes:
      - ./:/app
    restart: "no"