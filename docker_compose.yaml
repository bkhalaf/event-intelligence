version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Waiting for Kafka...' &&
      sleep 60 &&
      kafka-topics --create --if-not-exists --topic test-topic --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic output-topic --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1
      "
    restart: "no"
    
  producer-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: producer-api
    depends_on:
      - kafka
    ports:
      - "5000:5000"
    restart: on-failure

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consumer
    depends_on:
      - kafka
      - postgres
    command: python consumer.py
    volumes:
      - ./:/app
    restart: on-failure

  jobmanager:
    image: flink:1.18-java11
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink-job:/opt/flink/jobs

  taskmanager:
    image: flink:1.18-java11
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./flink-job:/opt/flink/jobs

  flink-job:
    build:
      context: ./flink-job
      dockerfile: Dockerfile
    container_name: flink-job
    depends_on:
      - kafka
      - kafka-init
      - jobmanager
      - taskmanager
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: kafka_events
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  db-seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db-seed
    depends_on:
      - postgres
    command: python seed.py
    restart: "no"
  